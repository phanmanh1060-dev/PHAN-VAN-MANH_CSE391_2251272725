<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 16 Pro Max - Trải nghiệm Multimedia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h2 { text-align: center; }
        figure {
            margin: 30px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #f9f9f9;
        }
        figcaption {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        video, audio {
            max-width: 100%;
            margin: 20px 0;
            border-radius: 8px;
        }
        .container { display: grid; gap: 30px; }
    </style>
</head>
<body>

    <h1>iPhone 16 Pro Max</h1>
    <p style="text-align:center; font-size:1.2em;">Trải nghiệm sản phẩm qua hình ảnh, video và âm thanh</p>

    
    <div class="container">

        <figure>
            <img src="https://picsum.photos/id/1015/800/600" 
                 alt="iPhone 16 Pro Max màu Titan Desert, mặt sau kính mờ cao cấp" 
                 loading="lazy">
            <figcaption>Hình 1: iPhone 16 Pro Max – Màu Titan Desert</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/201/800/600" 
                 alt="iPhone 16 Pro Max chụp ảnh đêm với camera 48MP" 
                 loading="lazy">
            <figcaption>Hình 2: Chụp đêm xuất sắc với camera 48MP</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/870/800/600" 
                 alt="iPhone 16 Pro Max hiển thị màn hình Super Retina XDR 6.9 inch" 
                 loading="lazy">
            <figcaption>Hình 3: Màn hình Super Retina XDR 6.9 inch</figcaption>
        </figure>

    </div>

    
    <h2>Video giới thiệu chính thức</h2>
    <iframe width="100%" height="500" 
            src="https://www.youtube.com/embed/5o4f8z5p5z8" 
            title="Apple iPhone 16 Pro Max Official Introduction" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>

    
    <h2>Video demo sản phẩm</h2>
    <video controls poster="https://picsum.photos/id/1015/800/450" width="100%">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny_720p.mp4" 
                type="video/mp4">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny_720p.webm" 
                type="video/webm">
        Trình duyệt của bạn không hỗ trợ thẻ video.
    </video>

    
    <h2>Nhạc nền giới thiệu sản phẩm</h2>
    <audio controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" 
                type="audio/mpeg">
    
    </audio>

    
    <h2>Logo SVG</h2>
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="90" fill="#0071e3" />
        <circle cx="100" cy="100" r="65" fill="white" />
        <text x="100" y="115" text-anchor="middle" fill="#0071e3" font-size="45" font-weight="bold"></text>
    </svg>

</body>
</html>
