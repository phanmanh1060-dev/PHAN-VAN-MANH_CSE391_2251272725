<!-- CMND/CCCD: đúng 12 chữ số -->
<input type="text" 
    id="idcard" 
    name="idcard" 
    pattern="^\d{12}$" 
    title="CMND/CCCD phải gồm đúng 12 chữ số" 
    required>

<!-- Số tài khoản: 10-15 chữ số -->
<input type="text" 
    id="account" 
    name="account" 
    pattern="^\d{10,15}$" 
    title="Số tài khoản phải từ 10 đến 15 chữ số" 
    required>
