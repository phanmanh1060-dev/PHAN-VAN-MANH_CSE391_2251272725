<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng - User Directory (CRUD)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Danh Sách Người Dùng</h1>
            <div class="action-bar">
                <input type="text" id="search-input" placeholder="🔍 Tìm theo tên hoặc email...">
                <button id="open-modal-btn" class="btn btn-primary">+ Thêm mới</button>
            </div>
        </header>

        <main id="user-container" class="user-grid">
            </main>
    </div>

    <div id="user-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <h2 id="modal-title">Thêm Người Dùng Mới</h2>
            
            <form id="user-form">
                <input type="hidden" id="form-user-id">
                
                <div class="form-group">
                    <label for="form-name">Họ và tên *</label>
                    <input type="text" id="form-name" required placeholder="Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label for="form-email">Email *</label>
                    <input type="email" id="form-email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="form-phone">Số điện thoại</label>
                    <input type="text" id="form-phone" placeholder="0901234567">
                </div>
                <div class="form-group">
                    <label for="form-company">Công ty</label>
                    <input type="text" id="form-company" placeholder="ABC Group">
                </div>
                
                <div class="form-actions">
                    <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Hủy</button>
                    <button type="submit" id="save-modal-btn" class="btn btn-primary">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
